apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

# Argo CD managing itself. Bump the version by changing the ref below —
# ONE MINOR AT A TIME (read the upgrade notes for each minor first:
# https://argo-cd.readthedocs.io/en/stable/operator-manual/upgrading/overview/).
# Patch bumps within a minor are safe to apply directly.
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.7/manifests/install.yaml
